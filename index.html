<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>To Do List VM</title>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

body{margin:0;font-family:'Figtree',system-ui,sans-serif;color:#1c1b3f;background:#e9eaf1}
*{box-sizing:border-box}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
.stage{min-height:100vh;padding:40px 28px 56px;background:linear-gradient(#e2e3ec 1px,transparent 1px) 0 0/100% 76px,linear-gradient(90deg,#e2e3ec 1px,transparent 1px) 0 0/76px 100%,radial-gradient(70% 50% at 50% 0%,#f6f6fb,#e9eaf1);position:relative}
.shell{position:relative;max-width:1180px;margin:0 auto;border-radius:56px;padding:36px 40px 44px;background:linear-gradient(160deg,rgba(255,255,255,.78),rgba(238,238,248,.7));border:2px solid rgba(255,255,255,.9);box-shadow:0 50px 90px -40px rgba(60,60,120,.45),inset 0 0 0 1px rgba(200,200,225,.5)}
.glass{background:linear-gradient(160deg,rgba(255,255,255,.7),rgba(236,236,247,.55));border:1px solid rgba(255,255,255,.95);box-shadow:0 22px 40px -28px rgba(60,60,130,.4),inset 0 0 0 1px rgba(205,205,230,.45);border-radius:30px}
.head{display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:14px;font-size:22px;font-weight:700;letter-spacing:-.01em;flex:none}
.logo{width:50px;height:50px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 12px 22px -10px rgba(60,60,130,.5),inset 0 0 0 1px rgba(205,205,230,.7)}
.search{flex:1;max-width:460px;margin-left:auto;display:flex;align-items:center;gap:10px;height:52px;padding:0 20px;border-radius:999px;background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.95);box-shadow:inset 0 0 0 1px rgba(205,205,230,.55);color:#6a6d92}
.search input{flex:1;border:0;background:transparent;outline:0;font-size:16px;color:#1c1b3f;min-width:0}
.search input::placeholder{color:#7b7ea0}
.search:focus-within{box-shadow:inset 0 0 0 2px #5b57ee}
.avatar{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#f6a93b,#e86f8c);display:grid;place-items:center;font-weight:700;color:#fff;font-size:17px;border:3px solid #fff;box-shadow:0 10px 20px -10px rgba(60,60,120,.6);flex:none}
.menuwrap{position:relative;flex:none}
.hamb{width:46px;height:46px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center}
.hamb:hover{background:rgba(255,255,255,.7)}
.pop{position:absolute;right:0;top:56px;z-index:30;width:230px;padding:10px;border-radius:24px;background:rgba(255,255,255,.96);box-shadow:0 30px 60px -20px rgba(60,60,130,.55);border:1px solid #e3e3f3}
.mi{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;text-align:left;padding:12px 14px;border-radius:16px;font-size:16px;font-weight:500}
.mi:hover{background:#f0f0fb}
.mi.on{background:#5b57ee;color:#fff}
.chips{display:flex;align-items:center;gap:12px;margin-top:26px;flex-wrap:wrap}
.chip{height:46px;padding:0 24px;border-radius:999px;border:0;background:rgba(255,255,255,.85);font-size:16px;font-weight:500;box-shadow:inset 0 0 0 1px rgba(205,205,230,.6);display:flex;align-items:center;gap:8px;position:relative}
.chip.on{background:linear-gradient(135deg,#5b57ee,#7d6bff);color:#fff;box-shadow:0 14px 26px -12px rgba(91,87,238,.9)}
.chip select{appearance:none;-webkit-appearance:none;border:0;background:transparent;font-size:16px;font-weight:500;color:#1c1b3f;cursor:pointer;padding-right:18px;outline-offset:6px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%235f6285' stroke-width='1.8' stroke-linecap='round'/></svg>");background-repeat:no-repeat;background-position:right center}
.chip.sel{padding:0 20px}
.clear{margin-left:auto;height:46px;padding:0 18px;border-radius:999px;border:0;background:rgba(255,255,255,.6);display:flex;align-items:center;gap:8px;font-size:14.5px;color:#4e5078;box-shadow:inset 0 0 0 1px rgba(205,205,230,.6)}
.stats{margin-top:26px;display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:24px;align-items:stretch}
.card{padding:24px 26px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.lbl{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:#2c2b57;margin:0 0 10px}
.big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.big strong{font-size:56px;line-height:1;font-weight:800;letter-spacing:-.03em;color:#111}
.big em{font-style:normal;font-size:16px;font-weight:500;color:#5f6285}
.cap{font-size:14px;color:#5f6285}
.warn{background:linear-gradient(160deg,rgba(255,236,237,.9),rgba(255,222,224,.6))}
.wbtn{margin-top:14px;height:44px;border:0;border-radius:999px;background:#111;color:#fff;font-size:15px;font-weight:600}
.wbtn:hover{background:#2a2a4a}
.stat{padding:0 30px;border-left:1px solid rgba(190,190,220,.6)}
.stat:first-child{padding-left:0;border-left:0}
.stat small{display:block;font-size:16px;color:#2c2b57;margin-bottom:6px}
.stat strong{display:block;font-size:40px;line-height:1.1;font-weight:700;letter-spacing:-.025em}
.stat span{display:block;font-size:14px;color:#6a6d92;margin-top:6px}
.stat.last{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stat em{font-style:normal;font-size:16px;font-weight:500;color:#5f6285;letter-spacing:0}
.prog{height:14px;border-radius:999px;background:rgba(160,160,205,.28);overflow:hidden;margin:12px 0 8px;box-shadow:inset 0 1px 3px rgba(60,60,130,.15)}
.prog i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#34c786,#1fb36f);animation:fillbar 1.3s cubic-bezier(.22,.8,.2,1) .3s both}
@keyframes fillbar{from{width:0}}
.tgs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tg{display:inline-flex;align-items:center;height:26px;padding:0 11px;border-radius:999px;font-size:12.5px;font-weight:600}
.tg.late{background:#ffd9db;color:#9c1c23}.tg.today{background:#fde5c3;color:#8f4a00}
.act2{display:flex;flex-direction:column;align-items:center;gap:10px}
@media (prefers-reduced-motion:reduce){.prog i{animation:none}}
.card.donutbox{flex-direction:row;align-items:center;justify-content:center;gap:22px}
.donut{position:relative;width:170px;height:170px;flex:none}
.donut svg{width:100%;height:100%;display:block;filter:drop-shadow(0 12px 14px rgba(91,87,238,.22))}
.seg{transform-origin:90px 90px;animation:drawseg 1.4s cubic-bezier(.22,.8,.2,1) both,breathe 5s ease-in-out 1.6s infinite;transform-box:view-box}
@keyframes drawseg{from{stroke-dasharray:0 440;opacity:.4}}
@keyframes breathe{50%{stroke-width:25}}
.dc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dc strong{font-size:40px;line-height:1;letter-spacing:-.03em}
.dc small{font-size:13px;color:#5f6285;margin:4px 0 0}
.dleg{list-style:none;margin:0;padding:0;display:grid;gap:10px;min-width:130px}
.dleg li{display:flex;align-items:center;gap:9px;font-size:15px;color:#2c2b57}
.dleg li i{width:12px;height:12px;border-radius:50%;flex:none}
.dleg li b{margin-left:auto;font-size:16px;padding-left:10px}
@media (prefers-reduced-motion:reduce){.seg{animation:none}}
.rbadge{width:46px;height:46px;border-radius:50%;background:#ffb3b7;color:#000;display:flex;align-items:center;justify-content:center;line-height:1;text-align:center;font-weight:800;font-size:20px;box-shadow:0 12px 22px -8px rgba(229,51,60,.7),inset 0 0 0 2px rgba(255,255,255,.7);flex:none}
.pillbtn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 16px;border-radius:999px;border:0;background:rgba(255,255,255,.85);font-size:14px;font-weight:500;box-shadow:inset 0 0 0 1px rgba(205,205,230,.6)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:30px;margin-top:30px}
.hc{position:relative;text-align:left;border:0;padding:22px 24px 20px;border-radius:30px;height:172px;overflow:hidden;box-shadow:0 26px 40px -24px rgba(60,60,140,.55),inset 0 0 0 2px rgba(255,255,255,.75);display:flex;flex-direction:column;justify-content:space-between}
.hc::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.55) 45%,transparent 60%);pointer-events:none}
.hc.o{background:linear-gradient(135deg,#ffd7c4 0%,#ffbfdc 26%,#cbc4ff 52%,#b4e9ff 76%,#e4ffd6 100%);color:#1c1b3f}
.hc.b{background:linear-gradient(135deg,#5b57ee 0%,#6d86ff 44%,#72d4ff 70%,#9a7bff 100%);color:#fff}
.hc.g{background:linear-gradient(135deg,#c6fff0 0%,#b7d6ff 38%,#e1c6ff 68%,#fff0c8 100%);color:#1c1b3f}
.hc.on{box-shadow:0 0 0 4px #5b57ee,0 26px 40px -24px rgba(60,60,140,.55)}
.hct{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1}
.hct b{font-size:22px;font-weight:700}
.hcc{width:50px;height:36px;border-radius:8px;background:linear-gradient(135deg,rgba(255,255,255,.85),rgba(255,255,255,.4));border:1px solid rgba(255,255,255,.8)}
.hcm{display:flex;align-items:flex-end;justify-content:space-between;position:relative;z-index:1}
.hcm strong{font-size:48px;line-height:1;font-weight:700;letter-spacing:-.03em}
.hcm span{font-size:14px;opacity:.9;max-width:150px;text-align:right;line-height:1.3}
.tag2{position:absolute;right:20px;top:-1px;font-size:11px;font-weight:600;padding:3px 10px;border-radius:0 0 10px 10px;background:rgba(255,255,255,.7);color:#4e5078;z-index:2}
.mid{display:grid;grid-template-columns:minmax(0,1fr);gap:30px;margin-top:30px;align-items:stretch}
.chart{padding:24px 26px 20px}
.ch{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.ch h2{margin:0;font-size:22px;font-weight:700}
.badge2{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 16px;border-radius:999px;background:#c8f3e0;color:#0f6a47;font-size:14px;font-weight:500}
.badge2 i{width:9px;height:9px;border-radius:50%;background:#e5333c;display:inline-block}
.plot{position:relative;height:214px;margin:8px 0 0 30px}
.grid{position:absolute;inset:0;background:repeating-linear-gradient(to bottom,transparent 0,transparent 47px,rgba(150,150,190,.28) 47px,rgba(150,150,190,.28) 48px)}
.ycap{position:absolute;left:-30px;font-size:12px;color:#7b7ea0}
.cols{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:end}
.col{display:flex;justify-content:center;align-items:flex-end;height:100%}
.stk{width:42px;display:flex;flex-direction:column;justify-content:flex-end;border-radius:10px 10px 0 0;overflow:hidden;box-shadow:0 10px 18px -12px rgba(60,60,130,.5)}
.stk i,.stk button{display:flex;align-items:center;justify-content:center;font-style:normal;font-size:14px;font-weight:700;color:#fff;overflow:hidden}
.stk .so{background:linear-gradient(180deg,#f7b04a,#f09a2b)}
.stk .sb{background:linear-gradient(180deg,#7aa8f6,#5b93f0)}
.stk .sg{background:linear-gradient(180deg,#34c786,#1fb36f)}
.line{position:absolute;inset:0;width:100%;height:100%}
.dot{position:absolute;width:14px;height:14px;margin:0 0 -7px -7px;border-radius:50%;background:#fff;border:3px solid #5b57ee}
.xl{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin:8px 0 0 30px;text-align:center;font-size:13px;color:#5f6285;font-weight:500}
.legend{display:flex;justify-content:center;gap:22px;margin:14px 0 0;font-size:13px;color:#4e5078}
.legend span{display:flex;align-items:center;gap:8px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
.actions{padding:24px 24px 22px;display:flex;flex-direction:column;gap:14px}
.actions h2{margin:0 0 2px;font-size:22px;font-weight:700}
.act{display:flex;align-items:center;gap:14px;width:100%;height:60px;padding:0 18px 0 10px;border-radius:999px;border:0;background:rgba(255,255,255,.85);font-size:16px;font-weight:500;text-align:left;box-shadow:inset 0 0 0 1px rgba(205,205,230,.6),0 10px 18px -14px rgba(60,60,130,.5)}
.act:hover{background:#fff}
.act .ci{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.act .arr{margin-left:auto;color:#7b7ea0}
.low{display:grid;grid-template-columns:minmax(0,1fr);gap:30px;margin-top:30px;align-items:start}
.tbl h2{margin:0;font-size:22px;font-weight:700}
.th{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:6px 6px 14px}
.th::after{content:""}
.tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tab{height:36px;padding:0 16px;border-radius:999px;border:0;background:rgba(255,255,255,.75);font-size:14px;font-weight:500;box-shadow:inset 0 0 0 1px rgba(205,205,230,.6);display:flex;align-items:center;gap:7px}
.tab.on{background:#5b57ee;color:#fff;box-shadow:none}
.tab em{font-style:normal;font-size:12.5px;opacity:.85}
.table{border-radius:28px;overflow:hidden;background:rgba(255,255,255,.7);box-shadow:inset 0 0 0 1px rgba(205,205,230,.5)}
.tr{display:grid;grid-template-columns:minmax(0,2.2fr) 110px minmax(0,1.1fr) minmax(0,1.1fr);gap:12px;align-items:center;padding:13px 22px;width:100%;border:0;background:transparent;text-align:left;font-size:15px}
.tr.hd{background:rgba(236,236,247,.8);font-size:14px;font-weight:600;color:#2c2b57;padding-top:16px;padding-bottom:16px}
button.tr:hover{background:rgba(255,255,255,.95)}
.tr+.tr{border-top:1px solid rgba(215,215,235,.8)}
.tt{display:flex;align-items:center;gap:12px;min-width:0;font-weight:500}
.tt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tt .tc{display:block;min-width:0}
.tt .si{overflow:visible}
.si{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:700}
.si.o{background:#f09a2b}.si.b{background:#5b93f0}.si.g{background:#1fb36f}.si.late{background:#e5333c}
.stl{display:inline-flex;align-items:center;height:26px;padding:0 12px;border-radius:999px;font-size:12.5px;font-weight:600;width:max-content}
.stl.o{background:#fde5c3;color:#8f4a00}.stl.b{background:#dbe7ff;color:#17489f}.stl.g{background:#d4f1e2;color:#0f6a3a}
.pc{font-size:13.5px;color:#34336f}
.dlx{font-size:14px;color:#34336f}
.dlx b{display:inline-block;margin-left:6px;font-size:12px;padding:2px 8px;border-radius:999px;font-weight:700}
.dlx b.late{background:#e5333c;color:#fff}.dlx b.today{background:#fde5c3;color:#8f4a00}.dlx b.soon{background:#dbe7ff;color:#17489f}
.pager{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 22px;border-top:1px solid rgba(215,215,235,.8)}
.pinfo{font-size:14px;color:#5f6285}
.pbtns{display:flex;gap:6px;align-items:center}
.pb{min-width:38px;height:38px;padding:0 10px;border-radius:50%;border:0;background:rgba(255,255,255,.85);box-shadow:inset 0 0 0 1px rgba(205,205,230,.7);font-size:15px;font-weight:600;display:grid;place-items:center}
.pb:hover:not(:disabled){background:#fff}
.pb.on{background:#111;color:#fff;box-shadow:none}
.pb:disabled{opacity:.4;cursor:default}
.more{display:flex;justify-content:center;padding:14px;border-top:1px solid rgba(215,215,235,.8)}
.empty{padding:26px;text-align:center;color:#5f6285}
.glow{position:relative;border-radius:46px;padding:5px;background:conic-gradient(from 180deg,#ff9ad5,#9ad7ff,#9affc9,#ffe39a,#c79aff,#ff9ad5);box-shadow:0 0 50px 6px rgba(160,140,255,.45)}
.glow .in{border-radius:42px;padding:34px 30px 28px;background:linear-gradient(150deg,#4a4590,#6a5fd0 60%,#7d6bff);color:#fff;min-height:250px;display:flex;flex-direction:column;justify-content:space-between}
.glow h2{margin:0;font-size:30px;line-height:1.1;font-weight:700;letter-spacing:-.02em}
.glow p{margin:10px 0 0;font-size:14.5px;line-height:1.45;color:#e3e0ff}
.gb{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.gbtn{height:46px;padding:0 22px;border-radius:999px;border:0;background:#fff;color:#2c2a6b;font-size:15px;font-weight:600}
.gbtn.ghost{background:rgba(255,255,255,.2);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.45)}
.page{margin-top:30px;padding:30px 32px}
.page h2{margin:0 0 4px;font-size:30px;font-weight:700}
.page>p{margin:0 0 18px;color:#5f6285;font-size:15px}
.nitem{display:flex;gap:14px;align-items:flex-start;padding:16px 4px;border-top:1px solid rgba(215,215,235,.9)}
.ndot{width:12px;height:12px;border-radius:50%;margin-top:5px;flex:none}
.nitem b{display:block;font-size:16px;font-weight:600}
.nitem span{font-size:14px;color:#5f6285}
.srow{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px 4px;border-top:1px solid rgba(215,215,235,.9)}
.srow b{display:block;font-size:16px;font-weight:600}
.srow span{font-size:14px;color:#5f6285;display:block;max-width:560px;line-height:1.45}
.sw{flex:none;width:56px;height:32px;border-radius:999px;border:0;background:#cfd0ea;position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .2s}
.sw.on{background:#5b57ee}.sw.on::after{transform:translateX(24px)}
.veil{position:fixed;inset:0;background:rgba(40,40,90,.28);z-index:60;border:0}
.drawer{position:fixed;top:0;right:0;bottom:0;width:430px;max-width:100%;z-index:70;padding:30px 28px 24px;border-radius:40px 0 0 40px;overflow:auto;background:rgba(250,250,255,.97);box-shadow:-30px 0 60px -30px rgba(40,40,100,.5)}
.drawer h3{margin:0 0 20px;font-size:26px;font-weight:700}
.fg{margin-bottom:20px}
.fg>label{display:block;font-size:14.5px;font-weight:600;margin-bottom:8px}
.inp{width:100%;height:52px;border-radius:18px;border:1px solid #d6d6ee;background:#fff;padding:0 16px;font-size:16px;color:#1c1b3f}
.ta{height:auto;min-height:92px;padding:14px 16px;line-height:1.45;resize:vertical;font-family:inherit}
.rmk{display:block;font-size:12.5px;font-weight:400;color:#5f6285;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inp:focus{outline:2px solid #5b57ee;outline-offset:2px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{border:1px solid #d6d6ee;background:#fff;border-radius:999px;padding:10px 17px;font-size:15px;font-weight:500}
.opt.on{background:#5b57ee;color:#fff;border-color:#5b57ee}
.dfoot{display:flex;gap:10px;margin-top:10px}
.btn{height:52px;border-radius:999px;border:1px solid #d6d6ee;background:#fff;padding:0 24px;font-size:16px;font-weight:600}
.btn.pri{background:linear-gradient(135deg,#5b57ee,#7d6bff);color:#fff;border-color:transparent;flex:1}
.btn.dng{background:#fde3e4;border-color:transparent;color:#a1262d}
.hint{font-size:13px;color:#5f6285;margin:0 0 14px}
.fab{position:fixed;right:32px;bottom:32px;z-index:50;display:flex;align-items:center;gap:10px;height:60px;padding:0 26px 0 22px;border:0;border-radius:999px;background:linear-gradient(135deg,#5b57ee,#7d6bff);color:#fff;font-size:16px;font-weight:600;box-shadow:0 22px 36px -12px rgba(91,87,238,.85),0 0 0 4px rgba(255,255,255,.7)}
.fab:hover{filter:brightness(1.06)}
.fab:focus-visible{outline:3px solid #1c1b3f;outline-offset:3px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1c1b3f;color:#fff;padding:13px 24px;border-radius:999px;font-size:15px;z-index:90}

/* poles profesional */
body{-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1,"cv11" 1}
.shell{max-width:1240px;padding:34px 44px 48px;box-shadow:0 60px 100px -50px rgba(40,40,110,.5),0 2px 0 rgba(255,255,255,.9) inset,inset 0 0 0 1px rgba(200,200,225,.5)}
.glass{box-shadow:0 1px 0 rgba(255,255,255,.95) inset,0 24px 44px -30px rgba(50,50,120,.45),inset 0 0 0 1px rgba(205,205,230,.5);transition:transform .25s ease,box-shadow .25s ease}
.glass:hover{box-shadow:0 1px 0 rgba(255,255,255,.95) inset,0 30px 50px -28px rgba(50,50,120,.5),inset 0 0 0 1px rgba(190,190,225,.7)}
.mnav{display:flex;gap:4px;padding:5px;margin-left:18px;border-radius:999px;background:rgba(255,255,255,.7);box-shadow:inset 0 0 0 1px rgba(205,205,230,.65)}
.nv{height:40px;padding:0 18px;border:0;border-radius:999px;background:transparent;font-size:14.5px;font-weight:600;color:#4e5078;transition:background .2s,color .2s}
.nv:hover{background:rgba(255,255,255,.95);color:#1c1b3f}
.nv.on{background:#111;color:#fff;box-shadow:0 10px 18px -10px rgba(0,0,0,.6)}
.menuwrap{display:none}
.brand{letter-spacing:-.02em}
.chip,.pillbtn,.tab,.opt,.btn,.act,.nv,.pb,.wbtn,.fab,.hamb,.mi,.tr{transition:background .18s,box-shadow .18s,transform .18s,color .18s}
.chip:not(.on):hover,.tab:not(.on):hover{background:#fff;transform:translateY(-1px)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #5b57ee;outline-offset:3px}
.table{box-shadow:0 1px 0 rgba(255,255,255,.9) inset,inset 0 0 0 1px rgba(205,205,230,.6),0 20px 40px -32px rgba(50,50,120,.5)}
.tr.hd{font-size:12.5px;font-weight:700;letter-spacing:.02em;color:#4e5078;background:rgba(232,232,246,.85)}
.tr{position:relative}
button.tr::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:#5b57ee;opacity:0;transition:opacity .18s}
button.tr:hover::before{opacity:1}
button.tr:hover{background:rgba(255,255,255,.98)}
.tt{font-weight:600}
.stl{height:28px;padding:0 13px}
.tbl h2,.ch h2,.page h2{letter-spacing:-.02em}
.th{padding:4px 4px 16px}
.mid{margin-top:26px}.low{margin-top:26px}
.chart{padding:26px 30px 22px}
.bar,.stk{transition:height .5s ease}
.btn.pri,.chip.on{box-shadow:0 14px 26px -12px rgba(91,87,238,.85),inset 0 1px 0 rgba(255,255,255,.35)}
.fab{transition:transform .2s,box-shadow .2s}
.fab:hover{transform:translateY(-2px)}
@media (max-width:1000px){.mnav{display:none}.menuwrap{display:block}.shell{padding:22px 18px 28px}}

/* tema malam: latar foto + kaca */
.stage{background:linear-gradient(180deg,rgba(5,9,26,.22),rgba(5,9,26,.5) 70%,rgba(5,9,26,.7)),url("data:,") center top/cover no-repeat,#0b1430;background-attachment:scroll}
.shell{background:none;border:0;box-shadow:none;backdrop-filter:none}
.brand{color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.45)}
.logo{box-shadow:0 0 0 4px rgba(255,255,255,.18),0 12px 26px -8px rgba(0,0,0,.6)}
.glass{background:linear-gradient(160deg,rgba(255,255,255,.86),rgba(240,240,252,.76));backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-color:rgba(255,255,255,.7)}
.tbl h2{color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.th{padding-bottom:14px}
.table{background:rgba(255,255,255,.86);backdrop-filter:blur(18px)}
.qf{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.qf .tab{background:rgba(255,255,255,.2);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);backdrop-filter:blur(8px)}
.qf .tab:hover{background:rgba(255,255,255,.35)}
.qf .tab.on{background:#fff;color:#111;box-shadow:0 10px 22px -10px rgba(0,0,0,.6)}
/* grafik gelap bercahaya */
.chart,.card.donutbox{background:linear-gradient(160deg,rgba(10,18,48,.8),rgba(30,36,92,.62));border-color:rgba(255,255,255,.16);color:#eceaff;box-shadow:0 30px 60px -30px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.18)}
.chart .ch h2{color:#fff}
.chart .badge2{background:rgba(31,179,111,.22);color:#9af2c8}
.chart .badge2 i{box-shadow:0 0 10px #ff5a62;background:#ff5a62}
.chart .grid{background:repeating-linear-gradient(to bottom,transparent 0,transparent 47px,rgba(255,255,255,.13) 47px,rgba(255,255,255,.13) 48px)}
.chart .ycap{color:#9aa3d8}
.chart .xl{color:#d6d9ff;font-weight:600}
.chart .legend{color:#d6d9ff}
.stk{box-shadow:0 0 26px -2px rgba(130,150,255,.55);transform-origin:bottom;animation:rise .9s cubic-bezier(.22,.8,.2,1) both}
@keyframes rise{from{transform:scaleY(.02);opacity:.3}}
.stk .so{background:linear-gradient(180deg,#ffc56e,#f09a2b)}
.stk .sb{background:linear-gradient(180deg,#8fb8ff,#4f86f0)}
.stk .sg{background:linear-gradient(180deg,#4fe0a0,#1fb36f)}
.card.donutbox .dc strong{color:#fff}
.card.donutbox .dc small{color:#b9bfe8}
.card.donutbox .dleg li{color:#eceaff}
.donut svg{filter:drop-shadow(0 0 12px rgba(140,160,255,.55))}
@media (prefers-reduced-motion:reduce){.stk{animation:none}}
/* avatar */
.avs{display:inline-flex;align-items:center}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700;border:2px solid #fff;margin-left:-8px;box-shadow:0 4px 8px -4px rgba(0,0,0,.4)}
.av:first-child{margin-left:0}
/* kanban */
.kb{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:26px;align-items:start}
.kcol{padding:18px 16px 16px;display:flex;flex-direction:column;gap:12px;min-height:260px;transition:box-shadow .2s}
.kcol.over{box-shadow:0 0 0 3px #7d6bff,0 0 40px rgba(125,107,255,.5)}
.kcol>header{display:flex;align-items:center;gap:10px;padding:0 6px 4px;font-size:17px;font-weight:700}
.kcol>header i{width:12px;height:12px;border-radius:50%}
.kcol>header span{margin-left:auto;font-size:14px;color:#5f6285}
.tk{background:#fff;border-radius:20px;padding:14px 16px;box-shadow:0 10px 20px -14px rgba(60,60,130,.5),inset 0 0 0 1px rgba(215,215,235,.8);display:flex;flex-direction:column;gap:10px;cursor:grab;transition:transform .15s,box-shadow .15s}
.tk:hover{transform:translateY(-2px);box-shadow:0 16px 26px -14px rgba(60,60,130,.6),inset 0 0 0 1px rgba(190,190,230,.9)}
.tk.drag{opacity:.45}
.tkt{border:0;background:none;padding:0;text-align:left;font-size:15px;font-weight:600;line-height:1.35;color:#1c1b3f}
.tk .rm{margin:0;font-size:13px;color:#5f6285}
.tk footer{display:flex;align-items:center;gap:8px}
.tk footer .avs{margin-left:auto}
.dl{font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:999px;background:#eef}
.dl.late{background:#e5333c;color:#fff}.dl.today{background:#fde5c3;color:#8f4a00}.dl.soon{background:#dbe7ff;color:#17489f}.dl.ok{background:#d4f1e2;color:#0f6a3a}.dl.none{background:#ececf6;color:#4e5078}
.mvb{height:36px;border:0;border-radius:999px;background:#111;color:#fff;font-size:13.5px;font-weight:600}
.mvb:hover{background:#2a2a4a}
.drop{border:2px dashed #b7b4ff;border-radius:20px;height:64px;display:grid;place-items:center;color:#5b57ee;font-size:14px;font-weight:600;background:rgba(91,87,238,.06)}
/* riwayat */
.page .h2b{margin:26px 0 4px;font-size:24px}
.ai{display:flex;gap:14px;padding:13px 0;border-top:1px solid rgba(215,215,235,.9);font-size:14.5px;line-height:1.4;align-items:flex-start}
.ai .av{width:34px;height:34px;margin:0;flex:none;font-size:12px}
.ai small{display:block;color:#7b7ea0;font-size:12.5px;margin-top:2px}
.pc .avs .av{margin-left:-8px}
/* tab bawah HP */
.btabs{display:none}
@media (max-width:1000px){
  .kb{grid-template-columns:1fr}
  .btabs{display:grid;grid-template-columns:1fr 1fr 70px 1fr 1fr;align-items:end;position:fixed;left:0;right:0;bottom:0;z-index:55;padding:10px 8px 14px;background:rgba(255,255,255,.94);backdrop-filter:blur(16px);box-shadow:0 -12px 30px -16px rgba(20,20,70,.6)}
  .bt{border:0;background:none;font-size:12.5px;font-weight:600;color:#7b7ea0;padding:10px 0}
  .bt.on{color:#111}
  .btplus{width:56px;height:56px;border-radius:50%;margin:-30px auto 0;border:0;background:linear-gradient(135deg,#5b57ee,#7d6bff);color:#fff;display:grid;place-items:center;box-shadow:0 16px 26px -10px rgba(91,87,238,.9),0 0 0 4px #fff}
  .fab{display:none}
  .stage{padding-bottom:110px}
  .qf{overflow:auto;flex-wrap:nowrap}.qf .tab{flex:none}
}

/* latar musim gugur (tidak di-zoom) */
.stage{background:#0b2b4a;position:relative;overflow:hidden}
.stage::before{content:"";position:fixed;inset:0;background:linear-gradient(rgba(6,18,38,.12),rgba(6,18,38,0) 45%,rgba(6,18,38,.1)),url("data:,") center/cover no-repeat;pointer-events:none;z-index:0}
.shell{position:relative;z-index:1}
.chart,.card.donutbox{background:linear-gradient(160deg,rgba(70,130,200,.5),rgba(40,92,158,.42));box-shadow:0 30px 60px -30px rgba(0,0,0,.75),inset 0 1px 0 rgba(200,225,255,.22)}
.stk{box-shadow:0 0 26px -2px rgba(255,170,70,.5)}
.donut svg{filter:drop-shadow(0 0 12px rgba(255,180,90,.5))}
.card.donutbox .dc small,.chart .ycap{color:#a9c0de}
.chart .xl,.chart .legend,.card.donutbox .dleg li{color:#e8f0fb}
/* popup di tengah layar */
.veil{background:rgba(5,12,24,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.drawer{top:50%;left:50%;right:auto;bottom:auto;transform:translate(-50%,-50%);width:580px;max-width:calc(100% - 32px);max-height:calc(100% - 40px);border-radius:32px;padding:30px 32px 28px;background:linear-gradient(160deg,#fff,#f4f4fc);box-shadow:0 50px 100px -30px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.6);animation:popin .22s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes popin{from{opacity:0;transform:translate(-50%,-48%) scale(.96)}}
.dhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.dhead h3{margin:0;font-size:26px;letter-spacing:-.02em}
.xbtn{width:42px;height:42px;border-radius:50%;border:0;background:#eeeef8;display:grid;place-items:center;color:#4e5078}
.xbtn:hover{background:#e2e2f2}
.drawer .fg>label{font-size:14px;color:#2c2b57}
.drawer .dfoot{margin-top:14px;padding-top:18px;border-top:1px solid #e6e6f4}
@media (prefers-reduced-motion:reduce){.drawer{animation:none}}

/* grafik versi premium */
.chart{padding:28px 32px 24px}
.chart .ch h2{font-size:24px;letter-spacing:-.02em}
.plot{height:240px;margin:14px 0 0 34px}
.chart .grid{background:linear-gradient(rgba(255,255,255,.16),rgba(255,255,255,.16)) 0 40px/100% 1px no-repeat,linear-gradient(rgba(255,255,255,.12),rgba(255,255,255,.12)) 0 140px/100% 1px no-repeat,linear-gradient(rgba(255,255,255,.3),rgba(255,255,255,.3)) 0 239px/100% 1px no-repeat}
.chart .ycap{left:-34px;font-size:12.5px;font-weight:600}
.col{flex-direction:column;justify-content:flex-end;align-items:center;gap:8px}
.tot{font-size:15px;font-weight:800;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.stk{width:54px;border-radius:14px 14px 4px 4px;box-shadow:0 0 0 1px rgba(255,255,255,.22),0 0 34px -2px rgba(120,190,255,.55),0 18px 30px -12px rgba(0,0,0,.6)}
.stk i,.stk button{font-size:14px;text-shadow:0 1px 4px rgba(0,0,0,.35);border-top:1px solid rgba(255,255,255,.28)}
.stk i:first-child,.stk button:first-child{border-top:0}
.stk .so{background:linear-gradient(180deg,#ffd089,#f09a2b 70%,#d9801a)}
.stk .sb{background:linear-gradient(180deg,#a8caff,#4f86f0 70%,#3a6fd8)}
.stk .sg{background:linear-gradient(180deg,#63efb2,#1fb36f 70%,#139a5c)}
.chart .xl{margin:12px 0 0 34px;font-size:13.5px;letter-spacing:.01em}
.chart .legend{margin-top:16px}
.chart .legend i{box-shadow:0 0 10px currentColor}
.card.donutbox .dc strong{text-shadow:0 0 22px rgba(160,200,255,.6)}

/* scroll di dalam popup */
.drawer{display:flex;flex-direction:column;overflow:hidden;padding:0;max-height:min(760px,calc(100% - 40px))}
.drawer .dhead{margin:0;padding:26px 32px 16px;border-bottom:1px solid #e6e6f4;flex:none}
.drawer .dbody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:20px 32px 6px;scrollbar-width:thin;scrollbar-color:#c9c9e6 transparent}
.drawer .dfoot{flex:none;margin:0;padding:16px 32px 24px;border-top:1px solid #e6e6f4;background:#fff}
@media (max-width:1000px){.drawer .dhead{padding:20px 20px 14px}.drawer .dbody{padding:16px 20px 4px}.drawer .dfoot{padding:14px 20px 20px}}

.stk button{border:0;border-top:1px solid rgba(255,255,255,.28);padding:0;font-family:inherit;cursor:pointer;transition:filter .15s}
.stk button:first-child{border-top:0}
.stk button:hover{filter:brightness(1.18)}
.stk button:focus-visible{outline:3px solid #fff;outline-offset:-3px}
.seg{cursor:pointer}
.seg:hover{stroke-width:26}
.dleg .lg{display:flex;align-items:center;gap:9px;width:100%;border:0;background:transparent;padding:6px 8px;margin:-6px -8px;border-radius:12px;font-size:15px;color:inherit;text-align:left}
.dleg .lg:hover{background:rgba(255,255,255,.12)}
.dleg .lg i{width:12px;height:12px;border-radius:50%;flex:none}
.dleg .lg b{margin-left:auto;padding-left:10px;font-size:16px}
@media (max-width:1000px){
  .stage{padding:16px 12px 40px}
  .shell{border-radius:36px;padding:22px 18px 28px}
  .head{flex-wrap:wrap}
  .search{order:5;max-width:none;flex-basis:100%;margin-left:0}
  .stats{grid-template-columns:1fr;gap:16px}
  .cards,.mid,.low{grid-template-columns:1fr}
  .th{grid-template-columns:1fr}
  .th::after{display:none}
  .th h2{text-align:center}
  .tr{grid-template-columns:minmax(0,1fr) auto}
  .tr .c-p,.tr .c-d,.tr.hd{display:none}
  .drawer{border-radius:28px}
}

<script>
(function(){

  return fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),redirect:'follow'})

function portOrder(a,b){var o={'ON PROSES':0,BELUM:1,SELESAI:2};if(o[a.status]!==o[b.status])return o[a.status]-o[b.status];var da=a.deadline||'9999',db=b.deadline||'9999';return da<db?-1:da>db?1:a.id-b.id}
function filtered(noSt){
  var q=S.q.trim().toLowerCase();
  var l=S.tasks.filter(function(t){
    if(!noSt&&S.st!=='ALL'&&t.status!==S.st)return false;
    if(S.pic!=='ALL'&&pics(t.pic).indexOf(S.pic)<0)return false;
    if(q&&(t.tugas+' '+t.remarks+' '+t.pic+' #'+t.id).toLowerCase().indexOf(q)<0)return false;
    var d=t.deadline?diff(t.deadline,S.today):null,open=t.status!=='SELESAI';
    if(S.dl==='LATE'&&!(open&&d!==null&&d<0))return false;
    if(S.dl==='URGENT'&&!(open&&d!==null&&d<=3))return false;
    if(S.dl==='TODAY'&&!(open&&d===0))return false;
    if(S.dl==='WEEK'&&!(open&&d!==null&&d>=0&&d<=7))return false;
    if(S.dl==='NONE'&&t.deadline)return false;
    return true;
  });
  l.sort(function(a,b){
    if(S.sort==='NEW')return b.id-a.id; if(S.sort==='OLD')return a.id-b.id;
    if(S.sort==='PIC')return String(a.pic).localeCompare(String(b.pic))||a.id-b.id;
    var x=a.status==='SELESAI'?1:0,y=b.status==='SELESAI'?1:0;if(x!==y)return x-y;
    var da=a.deadline||'9999',db=b.deadline||'9999';if(da!==db)return da<db?-1:1;return a.id-b.id;
  });
  return l;
}
var PER=10;
var AVC={'RIDHO':'#5b57ee','PAK HENDRA':'#e86f8c','HENDRA':'#e86f8c','HASAN':'#8b6bff','DIMAS':'#f09a2b','RIO':'#1fb36f','RIRIE':'#2aa5c9'},AVP=['#5b57ee','#e86f8c','#8b6bff','#f09a2b','#1fb36f','#2aa5c9','#d9534f','#3d8bf0'];
function avColor(n){if(AVC[n])return AVC[n];var h=0;for(var i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))>>>0;return AVP[h%AVP.length]}
function nice(p){return String(p).toLowerCase().replace(/(^|\s)\S/g,function(c){return c.toUpperCase()})}
function ini(n){n=String(n||'').trim();if(!n)return '?';if(/^[\d+\-\s]+$/.test(n))return 'WA';var w=n.split(/\s+/);return (w.length>1?w[0][0]+w[1][0]:n.slice(0,2)).toUpperCase()}
function avs(list,max){
  max=max||3;var sh=list.slice(0,max),ex=list.length-sh.length;
  return '<span class="avs">'+sh.map(function(p){return '<span class="av" style="background:'+avColor(p)+'" title="'+esc(p)+'">'+esc(ini(p))+'</span>'}).join('')+(ex>0?'<span class="av more">+'+ex+'</span>':'')+'</span>';
}
function pageList(cur,n){
  if(n<=7){var a=[];for(var i=1;i<=n;i++)a.push(i);return a}
  var r=[1];if(cur>3)r.push(0);for(var j=Math.max(2,cur-1);j<=Math.min(n-1,cur+1);j++)r.push(j);if(cur<n-2)r.push(0);r.push(n);return r;
}

  var key=names.map(function(p){return p+':'+s.by[p].map(function(t){return t.status.charAt(0)+(t.status==='ON PROSES'?'P':'')}).join('')}).join('|');

    var l=s.by[p],seg=[['SELESAI','sg','Selesai'],['ON PROSES','sb','On proses'],['BELUM','so','Belum']].map(function(k){
      var n=l.filter(function(t){return t.status===k[0]}).length;if(!n)return '';

    return '<div class="col"><span class="tot num">'+l.length+'</span><div class="stk rise" style="animation-delay:'+(ix*70)+'ms">'+seg+'</div></div>';

    '<div class="xl" style="grid-template-columns:'+tpl+'">'+names.map(function(p){return '<span title="'+esc(p)+'">'+esc(p)+'</span>'}).join('')+'</div>';
  Array.prototype.forEach.call($('chartBody').querySelectorAll('.stk button'),function(b){b.onclick=function(){goList(b.getAttribute('data-p'),b.getAttribute('data-k'),'ALL')}});

/* ---- riwayat aktivitas ---- */
function relTime(ts){
  var d=new Date(ts);if(isNaN(d))return '';var m=Math.round((Date.now()-d)/6e4);
  var hm=('0'+d.getHours()).slice(-2)+'.'+('0'+d.getMinutes()).slice(-2),n=new Date(),y=new Date(n.getFullYear(),n.getMonth(),n.getDate()-1);
  if(m<1)return 'baru saja';if(m<60)return m+' menit lalu';
  if(d.toDateString()===n.toDateString())return Math.round(m/60)+' jam lalu';
  if(d.toDateString()===y.toDateString())return 'kemarin '+hm;
  return d.getDate()+' '+BL[d.getMonth()]+' '+d.getFullYear()+', '+hm;
}
function logAct(who2,html){S.log.unshift({ts:Date.now(),who:who2||who||'Tamu',html:html});S.log=S.log.slice(0,30)}
function renderFeed(){
  var ev=S.log.map(function(e){return {ts:e.ts,who:e.who,html:e.html}});
  S.tasks.forEach(function(t){
    var a=new Date(t.masuk).getTime(),b=new Date(t.selesai).getTime(),ps=pics(t.pic);
    if(t.masuk&&!isNaN(a))ev.push({ts:a,who:t.pengirim||'Bot',html:'menambahkan <b>#'+t.id+' '+esc(t.tugas)+'</b>'+(ps.length?' untuk '+esc(ps.join(', ')):'')});
    if(t.status==='SELESAI'&&t.selesai&&!isNaN(b))ev.push({ts:b,who:ps[0]||t.pengirim||'Bot',html:'menyelesaikan <b>#'+t.id+' '+esc(t.tugas)+'</b>'});
  });
  ev.sort(function(a,b){return b.ts-a.ts});
  var n=Math.min(ev.length,S.feedN);
  $('feed').innerHTML='<h2>Riwayat aktivitas</h2><p>Tugas masuk dan tugas selesai, terbaru di atas.</p>'+
    (ev.length?ev.slice(0,n).map(function(e){var w=String(e.who||'Bot');return '<div class="ai"><span class="av" style="background:'+avColor(w.toUpperCase())+'">'+esc(ini(w))+'</span><div><b>'+esc(/^[\d+\-\s]+$/.test(w)?w:nice(w))+'</b> '+e.html+'<small>'+esc(relTime(e.ts))+'</small></div></div>'}).join(''):'<div class="none">Belum ada aktivitas.</div>')+
    (ev.length>n?'<button type="button" class="morebtn" id="feedMore">Tampilkan lebih banyak</button>':'');
  var fm=$('feedMore');if(fm)fm.onclick=function(){S.feedN+=20;renderFeed()};
}

/* ---- pilih & hapus beberapa ---- */
function selIds(){return Object.keys(S.sel).filter(function(k){return S.sel[k]}).map(Number)}
function setSel(id,on){if(on)S.sel[id]=1;else delete S.sel[id];var r=$('list').querySelector('.tr[data-id="'+id+'"]');if(r){r.classList.toggle('picked',!!on);var c=r.querySelector('input[data-k]');if(c)c.checked=!!on}syncBulk()}
function selectShown(on){filtered().forEach(function(t){if(on)S.sel[t.id]=1;else delete S.sel[t.id]});renderList()}
function syncBulk(){
  var ids=selIds().filter(function(id){return S.tasks.some(function(t){return t.id===id})});
  S.sel={};ids.forEach(function(id){S.sel[id]=1});
  var n=ids.length,shown=filtered(),allOn=shown.length&&shown.every(function(t){return S.sel[t.id]});
  $('bulk').hidden=!S.selMode;document.body.classList.toggle('picking',S.selMode);
  $('bN').textContent=n?n+' tugas dipilih':'Pilih tugas yang mau dihapus';
  $('bDel').disabled=!n;$('bDel').textContent=$('bDel').getAttribute('data-arm')?'Yakin hapus '+n+'? Klik lagi':'Hapus'+(n?' ('+n+')':'');
  $('bAll').textContent=allOn?'Batal pilih semua':'Pilih semua';
  $('selBtn').textContent=S.selMode?'Selesai memilih':'Pilih beberapa';
  var ca=$('ckAll');if(ca){ca.checked=!!allOn;}
}
function setSelMode(on){S.selMode=on;if(!on)S.sel={};disarm();renderList()}
function disarm(){clearTimeout($('bDel')._h);$('bDel').removeAttribute('data-arm')}
function delMany(){
  var ids=selIds();if(!ids.length)return;
  if(!$('bDel').getAttribute('data-arm')){$('bDel').setAttribute('data-arm','1');syncBulk();$('bDel')._h=setTimeout(function(){disarm();syncBulk()},4000);return}
  disarm();$('bDel').disabled=true;
  call('dash_deletemany',pw,ids,who).then(function(d){logAct(who,'menghapus <b>'+ids.length+' tugas</b>');apply(d);setSelMode(false);toast(ids.length+' tugas dihapus')}).catch(function(e){syncBulk();toast('Belum terhapus. '+e.message)});
}
function renderPicSel(){
  var set={};S.picList.forEach(function(p){set[p]=1});S.tasks.forEach(function(t){pics(t.pic).forEach(function(p){set[p]=1})});
  S.names=Object.keys(set).sort();
  $('fPic').innerHTML='<option value="ALL">Semua</option>'+S.names.map(function(p){return '<option value="'+esc(p)+'">'+esc(p)+'</option>'}).join('');
  if(S.names.indexOf(S.pic)<0)S.pic='ALL'; $('fPic').value=S.pic;
}
function paint(){renderQf();renderStats();renderChart();renderList();renderBoard();renderFeed()}
function renderAll(){renderPicSel();paint();$('refresh').title='Muat ulang (diperbarui '+new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})+')'}

/* ---- data ---- */
function apply(d){S.tasks=d.tasks;S.picList=d.picList||[];S.today=d.today;renderAll()}
function sig(ts){return ts.map(function(t){return [t.id,t.tugas,t.pic,t.status,t.deadline,t.remarks].join('|')}).join('~')}
function load(silent){return call('dash_load',pw).then(function(d){var ch=silent&&S.tasks.length&&sig(d.tasks)!==sig(S.tasks);apply(d);if(ch)toast('Ada pembaruan data terbaru (dari WhatsApp atau pengguna lain)')}).catch(function(e){if(/sandi/i.test(e.message))logout(true);else if(!silent)toast('Gagal memuat data. '+e.message)})}
function quick(id,status){
  var t=S.tasks.filter(function(x){return x.id===id})[0];if(!t)return;var old=t.status;t.status=status;paint();
  call('dash_status',pw,id,status,who).then(function(d){if(status!=='SELESAI')logAct(who,'memindahkan <b>#'+id+' '+esc(t.tugas)+'</b> ke '+({BELUM:'Belum','ON PROSES':'On proses'})[status]);apply(d);toast('Tugas #'+id+' kini '+({BELUM:'belum','ON PROSES':'on proses',SELESAI:'selesai'})[status])}).catch(function(e){t.status=old;renderAll();toast('Status belum tersimpan. '+e.message)});
}

/* ---- drawer ---- */
function openDrawer(id){
  var t=id?S.tasks.filter(function(x){return x.id===id})[0]:null;S.editId=t?t.id:null;
  S.form=t?{pics:pics(t.pic),status:t.status}:{pics:[],status:'BELUM'};
  $('dTitle').textContent=t?('Ubah tugas #'+t.id):'Tugas baru';
  $('dDel').style.display=t?'':'none';
  $('fTugas').value=t?t.tugas:'';$('fRem').value=t?t.remarks:'';$('fDate').value=t?(t.deadline||''):'';$('fPicNew').value='';$('dErr').textContent='';
  var fm=function(x){return new Date(x).toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'})};
  $('dMeta').innerHTML=t?('Dikirim oleh '+esc(t.pengirim||'-')+(t.masuk?'<br>Masuk '+fm(t.masuk):'')+(t.selesai?'<br>Selesai '+fm(t.selesai):'')):'Tugas baru akan tercatat atas nama '+esc(who||'Tamu')+'.';
  drawForm();$('veil').classList.add('show');$('drawer').classList.add('show');$('drawer').setAttribute('aria-hidden','false');setTimeout(function(){$('fTugas').focus()},250);
}
function closeDrawer(){$('veil').classList.remove('show');$('drawer').classList.remove('show');$('drawer').setAttribute('aria-hidden','true')}
function drawForm(){
  var all=S.names.slice();S.form.pics.forEach(function(p){if(all.indexOf(p)<0)all.push(p)});
  all.sort();
  $('fPics').innerHTML=all.map(function(p){return '<button type="button" class="opt'+(S.form.pics.indexOf(p)>=0?' on':'')+'" data-p="'+esc(p)+'" aria-pressed="'+(S.form.pics.indexOf(p)>=0)+'">'+esc(p)+'</button>'}).join('');
  Array.prototype.forEach.call($('fPics').children,function(b){b.onclick=function(){var p=b.getAttribute('data-p'),i=S.form.pics.indexOf(p);if(i>=0)S.form.pics.splice(i,1);else S.form.pics.push(p);drawForm()}});
  Array.prototype.forEach.call($('fSt').children,function(b){b.classList.toggle('on',b.getAttribute('data-v')===S.form.status)});
}
function addPic(){var v=$('fPicNew').value.trim().toUpperCase();if(!v)return;pics(v).forEach(function(p){if(S.form.pics.indexOf(p)<0)S.form.pics.push(p)});$('fPicNew').value='';drawForm()}
function save(){
  var tugas=$('fTugas').value.trim();if(!tugas){$('dErr').textContent='Isi nama tugas dulu.';$('fTugas').focus();return}
  $('dSave').disabled=true;
  call('dash_save',pw,{id:S.editId,tugas:tugas,pic:S.form.pics.join(', '),status:S.form.status,deadline:$('fDate').value,remarks:$('fRem').value.trim()},who)
    .then(function(d){var was=S.editId;if(was)logAct(who,'mengubah <b>#'+was+' '+esc(tugas)+'</b>');apply(d);closeDrawer();toast(was?'Perubahan tersimpan':'Tugas baru tersimpan')})
    .catch(function(e){$('dErr').textContent='Belum tersimpan. '+e.message})
    .then(function(){$('dSave').disabled=false});
}
function del(){
  if(!S.editId)return;var b=$('dDel');
  if(!b._a){b._a=true;b.textContent='Klik lagi untuk menghapus';clearTimeout(b._t);b._t=setTimeout(function(){b._a=false;b.textContent='Hapus tugas'},4000);return}
  b._a=false;b.textContent='Hapus tugas';
  call('dash_delete',pw,S.editId,who).then(function(d){logAct(who,'menghapus tugas <b>#'+S.editId+'</b>');apply(d);closeDrawer();toast('Tugas dihapus')}).catch(function(e){$('dErr').textContent='Belum terhapus. '+e.message});
}

/* ---- login ---- */
function setAv(){if($('mh'))renderMtitle();$('user').textContent=who?ini(who):'?';$('user').setAttribute('aria-label','Ganti nama ('+(who||'belum diisi')+')')}
function showApp(){$('login').classList.add('hide');$('app').hidden=false;setAv();$('out').hidden=!pw;$('outM').hidden=!pw}
function logout(expired){LS.del('vmdash_pw');pw='';clearInterval(timer);$('app').hidden=true;$('login').classList.remove('hide');$('lPw').value='';$('lErr').textContent=expired===true?'Sesi berakhir. Masuk lagi dengan kata sandi.':'';animate=true}
function login(){
  var p=$('lPw').value,n=$('lName').value.trim();if(!p){$('lErr').textContent='Isi kata sandi dulu.';return}
  pw=p;who=n||who||'Tamu';$('lBtn').disabled=true;$('lErr').textContent='';
  call('dash_load',pw).then(function(d){LS.set('vmdash_pw',pw);LS.set('vmdash_name',who);showApp();apply(d);tick()})
    .catch(function(e){$('lErr').textContent=e.message;pw=''}).then(function(){$('lBtn').disabled=false});
}
function tick(){clearInterval(timer);timer=setInterval(function(){if(!document.hidden&&!$('drawer').classList.contains('show')&&!busy)load(true)},60000)}

/* ---- events ---- */
$('lBtn').onclick=login;$('lPw').onkeydown=function(e){if(e.key==='Enter')login()};$('lName').value=who;
$('out').onclick=function(){logout()};$('outM').onclick=function(){logout()};
$('user').onclick=function(){var v=window.prompt('Nama Anda (dipakai sebagai pengirim perubahan):',who||'');if(v&&v.trim()){who=v.trim().slice(0,30);LS.set('vmdash_name',who);setAv()}};
$('refresh').onclick=function(){load()};$('selBtn').onclick=function(){setSelMode(!S.selMode)};$('bCancel').onclick=function(){setSelMode(false)};$('bAll').onclick=function(){var shown=filtered(),allOn=shown.length&&shown.every(function(t){return S.sel[t.id]});selectShown(!allOn)};$('bDel').onclick=delMany;$('newBtn').onclick=function(){openDrawer(null)};$('btPlus').onclick=function(){openDrawer(null)};
$('q').oninput=function(){S.q=this.value;paint()};
$('fPic').onchange=function(){S.pic=this.value;paint()};
$('fStS').onchange=function(){S.st=this.value;paint()};
$('fDl').onchange=function(){S.dl=this.value;paint()};
$('resetF').onclick=function(){resetFilters();paint()};$('chipAll').onclick=function(){resetFilters();paint()};
$('fbtn').onclick=function(){var on=document.body.classList.toggle('showf');this.setAttribute('aria-expanded',String(on))};
$('hamb').onclick=function(e){e.stopPropagation();var h=$('pop').hidden;$('pop').hidden=!h;this.setAttribute('aria-expanded',String(h))};
document.addEventListener('click',function(e){var g=e.target.closest('[data-go]');if(g){e.preventDefault();setView(g.getAttribute('data-go'));return}if(!e.target.closest('.menuwrap')){$('pop').hidden=true}});
Array.prototype.forEach.call($('fSt').children,function(b){b.onclick=function(){S.form.status=b.getAttribute('data-v');drawForm()}});
Array.prototype.forEach.call(document.querySelectorAll('.quick button'),function(b){b.onclick=function(){var v=b.getAttribute('data-d');$('fDate').value=v==='x'?'':addDays(S.today,Number(v))}});
$('fPicAdd').onclick=addPic;$('fPicNew').onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();addPic()}};
$('dSave').onclick=save;$('dCancel').onclick=closeDrawer;$('dClose').onclick=closeDrawer;$('dDel').onclick=del;$('veil').onclick=closeDrawer;
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeDrawer()});

/* Tanpa login: langsung masuk. Layar login hanya muncul bila server meminta kata sandi. */
showApp();window._ca=true;setView('home',true);
call('dash_load',pw).then(function(d){apply(d);tick()})
  .catch(function(e){if(/sandi/i.test(e.message))logout(pw?true:false);else{toast('Gagal memuat data. '+e.message);tick()}});
})();
</script>
</body>
</html>
